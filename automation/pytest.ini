[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --timeout=60
    --continue-on-collection-errors
markers =
    authentication: Authentication tests (TC-AUTH)
    authorization: Authorization tests (TC-AUTHZ)
    navigation: Navigation tests (TC-NAV)
    ui_validation: UI Validation tests (TC-UI)
    forms: Form tests (TC-FORM)
    crud: CRUD Operation tests (TC-CRUD)
    input_validation: Input Validation tests (TC-INPUT)
    error_handling: Error Handling tests (TC-ERR)
    session_management: Session Management tests (TC-SESS)
    file_upload: File Upload tests (TC-FILE)
    accessibility: Accessibility tests (TC-ACC)
    responsive: Responsive Design tests (TC-RESP)
    performance: Performance Smoke tests (TC-PERF)
    regression: Regression tests (TC-REG)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %H:%M:%S
